# Ручные узлы: люди, решения, маркетинг. Источник: решения Юры (чаты) и документация.
people:
  - {id: person.yura, name: "Юра", area: team, summary: "Автор идеи и геймдизайна, генерирует ассеты в Meshy сам, играет и тестирует билды.", owner: Юра}
  - {id: person.kirill, name: "Кирилл", area: team, summary: "Разработка вместе с Юрой, работает через свой Claude.", owner: Кирилл}
  - {id: person.danila, name: "Данила", area: team, summary: "Художник, свой Claude, доступ к Jira.", owner: Данила}
  - {id: person.denis, name: "Денис", area: marketing, summary: "Маркетолог (контакт Rin): скриншоты, гифки, бриф, условия; запуск рекламы для вишлистов.", owner: Денис}
decisions:
  - {id: dec.core-loop, name: "Ядро: кооперативный перенос еды", area: gameplay, date: "2026-10-29", summary: "Основа игры: совместное таскание еды. Человек, кошка и собака всегда атакуют; можно лазить по еде, людям и питомцам."}
  - {id: dec.real-scale, name: "Реальный размер муравья (8 мм)", area: world, date: "2026-10", summary: "Муравей ровно 8 мм, в три раза мельче прототипа; одна константа AntShrink тянет камеру, скорости и радиусы."}
  - {id: dec.run-of-shifts, name: "Цикл: смены с квотой", area: gameplay, date: "2026-11-17", summary: "Петля забега: квота, фазы Человека, общие жизни. Позже добавлен снежный ком внутри рейда."}
  - {id: dec.one-style, name: "Единый визуальный стиль, без чужих паков", area: items, date: "2026-11-17", summary: "Никаких смешанных бесплатных паков, всё в одном стиле: тёплый уют, сочный свет."}
  - {id: dec.meshy-bible, name: "Ассеты генерирует Юра в Meshy по библии", area: items, date: "2026-11-23", summary: "Ассеты карты v4 из бесплатных паков и Higgsfield не понравились. Юра сам генерирует каждый ассет по детальному промпту на каждую часть; предметы сгруппированы по комнатам, расстановка модульная (контейнеры, слоты, наборы)."}
  - {id: dec.progression-3-layers, name: "Прогрессия в три слоя", area: meta, date: "2026-11-23", summary: "Боец (сайдгрейды и облик, не сила), отряд (именные ветераны, постоянная смерть, стена памяти), муравейник (один на группу у хоста, 2D-экран)."}
  - {id: dec.tone, name: "Тон: военная пародия на стороне муравьёв", area: audio, date: "2026-11-21", summary: "Starship Troopers плюс Apocalypse Now плюс Worms; квартира остаётся уютной. Озвучка на русском и английском, ударения проверять."}
  - {id: dec.team-size, name: "Кооп: 4 игрока, до 8", area: tech, date: "2026-11-21", summary: "Сейчас 4 игрока, технически до 8. Установки не нужны: запустил и играешь."}
  - {id: dec.early-access, name: "Цель: альфа в Steam Early Access", area: team, date: "2026-11-17", summary: "Одна версия Early Access, весёлое сочное ядро, лишнее вырезать; сначала вишлисты и реакции."}
  - {id: dec.destruction-ants-only, name: "Ломают только муравьи", area: physics, date: "2026-11-21", summary: "Любой предмет можно сломать, уронить, оторвать, деформировать, но только муравьям (например выкрутить шурупы у шкафа). Человек ломает своё в режиме versus."}
  - {id: dec.no-testing-by-claude, name: "Не тратить токены на самотест запусками", area: team, date: "2026-10", summary: "Собрал, дал чеклист что посмотреть. Юра играет сам и присылает пачку замечаний."}
marketing:
  - {id: mk.steam, name: "Страница Steam и вишлисты", area: marketing, status: in-progress, owner: Юра, summary: "Регистрация у Юры, ждёт документы и счёт в банке."}
  - {id: mk.trailer, name: "Трейлер под «Полёт валькирий»", area: marketing, status: designed, owner: Денис, summary: "Нужны лучше режиссура, мемность, качество рекламы; первый автотрейлер был тестовым."}
  - {id: mk.style, name: "Стиль маркетинга: 3D-мультфильм и жирный комикс", area: marketing, status: designed, owner: Денис, summary: "Из четырёх вариантов выбраны 3D-мультфильм и комикс; каждому персонажу отдельный характер."}
  - {id: mk.voice, name: "Озвучка RU/EN (ElevenLabs)", area: audio, status: in-progress, owner: Юра, summary: "Нужна на русском и английском, с правильными ударениями."}
