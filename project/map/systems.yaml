# Системы игры (ручной слой). modules: регулярки по именам модулей Source/AntKitchen (без .h/.cpp).
# status: idea / designed / in-progress / in-game / polished / blocked / deprecated
systems:
  - {id: sys.ant-player, area: gameplay, name: "Муравей-игрок: движение и лазание", status: in-game, owner: Claude, modules: ['^AntCharacter$','^AntMovementComponent$','^AntPlayerController$','^AntPlayerState$'], summary: "Ползание по стенам и потолку, прыжок, захват, клиент-авторитетное движение."}
  - {id: sys.ant-body, area: gameplay, name: "Тело муравья из сегментов", status: in-game, owner: Claude, modules: ['^AntBody$'], summary: "Муравей как шарнирное насекомое: голова, жвалы, грудь, стебелёк, брюшко, 6 ног по 4 сегмента, усики. Нет скелета, UAntBodyComponent позирует куски каждый кадр.", links: [character.ant]}
  - {id: sys.carry, area: gameplay, name: "Перенос еды вместе", status: in-game, owner: Claude, modules: ['^AntCarry$','^AntHaulAdapter$'], summary: "Муравьи физически поднимают предмет лапами, вес и положение распределяются по ногам, до 8 игроков.", docs: [docs/FEATURES.md]}
  - {id: sys.swarm, area: gameplay, name: "Снежный ком, рой и отряд ботов", status: in-game, owner: Claude, modules: ['^AntSwarm$','^AntSnowball$','^AntArmy$','^AntSquad$','^AntRts$','^AntTrail$'], summary: "Каждый раунд с одного муравья, еда даёт массу и апгрейды, выделение отряда, тропы для рабочих."}
  - {id: sys.raid, area: gameplay, name: "Рейд, смены и маршруты", status: in-game, owner: Claude, modules: ['^AntRaid','^AntRun$','^AntSession$','^AntGameState$','^AntKitchenGameMode$','^AntRoutes$'], summary: "Цикл забега: квота, фазы Человека, общие жизни, итоги, сид уровня."}
  - {id: sys.weapon, area: gameplay, name: "Оружие муравья и кислота", status: in-game, owner: Claude, modules: ['^AntWeapon$','^AcidProjectile$'], summary: "Кислотный плевок, укус, оружие бойца."}
  - {id: sys.versus, area: gameplay, name: "Человек против муравьёв", status: in-game, owner: Claude, modules: ['^AntVersus$','^WarMode$'], summary: "Игрок за Человека громит кухню и защищает еду против игроков-муравьёв."}
  - {id: sys.bots, area: gameplay, name: "Боты-муравьи", status: in-game, owner: Claude, modules: ['^AntBotController$'], summary: "ИИ ботов, команды AddBot."}
  - {id: sys.tutorial, area: gameplay, name: "Учебка Сержанта Жвалова и демо", status: in-game, owner: Claude, modules: ['^AntTutorial$'], summary: "16 этапов обучения, песочница, демо-рейд. Живым человеком не проверено.", docs: [docs/ONBOARDING.md, docs/DEMO.md]}
  - {id: sys.inside, area: gameplay, name: "Внутрь людей, реакции, ткань", status: in-game, owner: Claude, modules: ['^AntInside$','^AntReact$','^AntCloth$'], summary: "Муравьи лезут в ухо, штанину, карман; настоящая ткань скатерти."}
  - {id: sys.human, area: characters, name: "Люди: тело, ИИ, маршруты", status: in-game, owner: Claude, modules: ['^Human','^Npc','^FolkCharacters$'], summary: "Папа, бабушка, малыш как тяжёлые тела из сегментов с инерцией, пинком, полу-рэгдоллом; распорядок дня.", links: [character.dad, character.gran, character.kid]}
  - {id: sys.critters, area: creatures, name: "Животные и насекомые", status: in-game, owner: Claude, modules: ['^Critter','^CreatureCharacters$','^Quad'], summary: "Кошка Муся, Бадрик, муха, паук: четвероногое тело и мозг.", links: [character.cat, character.dog]}
  - {id: sys.level, area: world, name: "Квартира: уровень v4", status: in-game, owner: Claude, modules: ['^LevelV','^Map4','^KitchenHouse$','^KitchenBuilder$','^KitchenArt$','^KitchenFixture$','^AntNest$'], summary: "Районы, сид рейда, оболочка стен и полов, свет и материалы, без примитивов.", docs: [docs/level/LEVEL_V3.md, docs/level/V4_AUDIT.md]}
  - {id: sys.levellab, area: world, name: "Лаборатория уровней (KAN-37): серые планировки из данных", status: in-progress, owner: Claude, modules: ['^AntLab$','^KitchenBuilderLab$'], summary: "Планировка квартиры как JSON (Tools/levellab/build_lab.py -> docs/level/lab/lab_A.json): коробки с флагом лазания, зоны, люки в стенах, гнездо, еда, торт, обход Человека, граф маршрутов. -AntLab=A или меню кооператива; автопроверка lab check, план Saved/levellab/plan_A.png. Пока только вариант A «Двушка».", docs: [docs/level/lab/lab_A.json]}
  - {id: sys.life, area: world, name: "Живая квартира: ТВ, мир за окном", status: in-game, owner: Claude, modules: ['^AntLife'], summary: "Телевизор с каналами, улица за окном, робот-пылесос, посудомойка, мелочи масштаба муравья.", docs: [docs/LIFE_SPEND.md]}
  - {id: sys.interactive, area: world, name: "Интерактивные предметы и гаджеты", status: in-game, owner: Claude, modules: ['^KitchenInteractables$','^KitchenMover$','^KitchenGadgets$','^KitchenEvents$'], summary: "Двери, ящики, кран, тостер, щиток, события кухни."}
  - {id: sys.loot, area: items, name: "Лут и еда", status: in-game, owner: Claude, modules: ['^KitchenLoot$'], summary: "Еда ярусов T0-T3, разрезание на куски, добыча с существ, торт на день рождения."}
  - {id: sys.fluid, area: physics, name: "Настоящая вода и жидкости", status: in-game, owner: Claude, modules: ['^AntFluid','^KitchenSlick$'], summary: "Симуляция воды, течение несёт крошки, лужи, скользкая лужа.", docs: []}
  - {id: sys.mess, area: physics, name: "Грязь, следы, пыль", status: in-game, owner: Claude, modules: ['^AntMess'], summary: "Размазывание еды, следы, пылинки в свете."}
  - {id: sys.destruction, area: physics, name: "Разрушение, осколки, рэгдолл", status: in-game, owner: Claude, modules: ['^AntWreck','^AntGibs$','^KitchenShards$','^AntRagdoll$'], summary: "Мебель падает и бьётся, осколки режут, муравьи разлетаются на части."}
  - {id: sys.chains, area: physics, name: "Материалы и цепные реакции 2.0", status: in-game, owner: Claude, modules: ['^AntMaterials$','^AntChain$'], summary: "39 материалов, тепло, порошки, электричество, цепочки C7-C22.", docs: [docs/MATERIALS.md, docs/CHAINS_SPEND.md]}
  - {id: sys.colony, area: meta, name: "Муравейник: экран колонии", status: in-game, owner: Claude, modules: ['^AntColony','^AntMetaBus$'], summary: "2D-разрез муравейника, постройки по ярусам, королева, меняется после каждого рейда.", docs: [docs/COLONY.md, docs/COLONY_SPEND.md]}
  - {id: sys.fighter, area: meta, name: "Боец и отряд: звания, перки, ветераны", status: in-game, owner: Claude, modules: ['^AntFighter$','^AntVeterans$','^AntClan$','^AntCosmetics$'], summary: "Сайдгрейд-перки, медали, облик, именные ветераны с постоянной смертью.", docs: [docs/FIGHTER.md, docs/FIGHTER_SPEND.md]}
  - {id: sys.ui, area: ui, name: "Интерфейс «кухонный штаб»", status: in-game, owner: Claude, modules: ['^AntUi','^AntHUD','^AntMenu$','^AntFighterUi$'], summary: "Меню, лобби, настройки, загрузка, HUD, карты, донесение.", docs: [docs/UI_STYLE.md, docs/UI_FLOW.md, docs/UI_CREDITS.md]}
  - {id: sys.audio, area: audio, name: "Звук и музыка", status: in-game, owner: Claude, modules: ['^AntAudio$'], summary: "Адаптивный саундтрек, 130 новых звуков, микс.", docs: [docs/AUDIO.md, docs/AUDIO_CREDITS.md, SOUNDS.md]}
  - {id: sys.core, area: tech, name: "Ядро, типы, эффекты", status: in-game, owner: Claude, modules: ['^AntKitchen$','^AntTypes$','^AntFx$'], summary: "Модуль игры, общие типы, масштаб (AntShrink), эффекты."}
  - {id: sys.admin, area: tech, name: "Админ-режим", status: in-game, owner: Claude, modules: ['^AntAdmin$'], summary: "Панель и команды для тестов и съёмки.", docs: [docs/ADMIN.md]}
  - {id: sys.net, area: tech, name: "Сеть: listen server", status: in-game, owner: Claude, modules: [], summary: "Listen server, UDP 7777, клиент-авторитетное движение, реплицируется состояние."}
  - {id: sys.film, area: marketing, name: "Режим съёмки", status: in-game, owner: Claude, modules: ['^AntFilm$'], summary: "Камеры и сценарии для трейлеров и скриншотов.", docs: [docs/FILMING.md]}
  - {id: sys.misc, area: tech, name: "Прочий код", status: in-game, owner: Claude, modules: [], summary: "Модули, которые не попали в другие системы."}
  - {id: sys.tools, area: tools, name: "Скрипты Tools/", status: in-game, owner: Claude, modules: [], summary: "Импорт Meshy, Blender-скрипты, сборка, тесты."}
  - {id: sys.asset-pipeline, area: tools, name: "Пайплайн ассетов Meshy в Unreal", status: in-progress, owner: Юра, modules: [], summary: "Юра генерирует в Meshy по карточкам библии, кладёт в SourceArt/Meshy/<Комната>/<ID>/, Claude импортирует (Tools/import_meshy.py), ставит масштаб, коллизии, расстановку.", docs: [ASSETS.md]}
  - {id: sys.projectmap, area: tools, name: "Карта проекта (эта система)", status: in-game, owner: Claude, modules: [], summary: "project/map/*.yaml + Tools/projectmap/build_map.py -> map.json -> интерактивная страница.", docs: [CLAUDE.md]}
  - {id: sys.marketing, area: marketing, name: "Маркетинговый комплект и трейлеры", status: in-progress, owner: Денис, modules: [], summary: "Скриншоты, гифки, ролики, стиль: мультфильм 3D и жирный комикс. Ролик под «Полёт валькирий».", docs: []}
  - {id: sys.process, area: team, name: "Процесс работы и правила Claude", status: in-game, owner: Юра, modules: [], summary: "Jira ANT для агентов, ветки code/ANT-*, LFS-замки, PR в main, FPF.", docs: [CLAUDE.md, README.md]}
