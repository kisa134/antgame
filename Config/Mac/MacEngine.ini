; Mac-only overrides (read on top of DefaultEngine.ini when the game runs or cooks for Mac; Windows ignores this file).
; Goal: a co-op test build that is playable on a plain Apple Silicon laptop (M1/M2, 8-16 GB).
; Full guide: docs/MAC_BUILD.md. To get the Windows look back, delete these lines (or the whole file) and re-package.

[/Script/Engine.RendererSettings]
; Lumen GI is the heaviest thing in the Windows config; on a base M1 it eats most of the frame. 0 = no dynamic GI.
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=2
; Virtual shadow maps need Metal SM6; with the SM5 profile plain shadow maps are used anyway.
r.Shadow.Virtual.Enable=0
